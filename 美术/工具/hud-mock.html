<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>老友粉店 · HUD 合成校验</title>
<style>
  :root{
    --paper:#fff8e6; --paper2:#f5e9cc; --ink:#3b2b1d; --shadow:#c3ad84;
    --brick:#d05b4f; --bamboo:#5fa34f; --mustard:#ffc845; --wood:#8a5a3b;
    --sky:#3f8bc9; --chili:#c8442f; --sour:#7fa650; --orange:#f2a33c;
    --scene:#fdf8db;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:768px;overflow:hidden;background:var(--scene)}
  body{
    font-family:"SimSun","宋体",monospace;
    color:var(--ink);
    -webkit-font-smoothing:none;
    font-smooth:never;
    position:relative;
    letter-spacing:.5px;
  }
  #stage{position:absolute;inset:0;overflow:hidden;background:var(--scene)}
  /* 场景底图：D 图 1920→1024，内容包围盒 y138..883，上移 130 使其贴顶 */
  #scene{position:absolute;left:0;top:-130px;width:1024px;height:1024px;image-rendering:auto}

  /* ---------- 通用像素块 ---------- */
  .card{
    background:rgba(255,248,230,.94);
    border:3px solid var(--ink);
    box-shadow:4px 4px 0 rgba(195,173,132,.85);
  }
  .ttl{
    font-size:12px;line-height:1;padding:7px 8px 6px;
    background:var(--ink);color:var(--paper);
    letter-spacing:2px;
  }

  /* ---------- 顶栏 ---------- */
  #topbar{
    position:absolute;left:0;top:0;width:1024px;height:52px;
    background:rgba(255,248,230,.96);
    border-bottom:3px solid var(--ink);
    display:flex;align-items:center;gap:14px;padding:0 10px;
    box-shadow:0 3px 0 rgba(195,173,132,.6);
  }
  .logo{
    background:var(--brick);color:var(--paper);
    border:3px solid var(--ink);padding:5px 9px 4px;
    font-size:15px;letter-spacing:3px;box-shadow:3px 3px 0 var(--shadow);
  }
  .date{font-size:16px;letter-spacing:1px}
  .date b{font-size:19px}
  .stat{display:flex;align-items:center;gap:5px;font-size:13px}
  .stat .k{color:#8a7a63;font-size:11px}
  .stat .v{font-size:15px;font-weight:bold}
  .bar-mini{width:78px;height:9px;border:2px solid var(--ink);background:var(--paper2);position:relative}
  .bar-mini i{display:block;height:100%;background:var(--bamboo)}
  .stars{color:var(--mustard);font-size:14px;letter-spacing:0;text-shadow:1px 1px 0 var(--ink)}
  .spacer{flex:1}
  .pill{
    border:3px solid var(--ink);background:var(--bamboo);color:var(--paper);
    font-size:12px;padding:4px 8px 3px;letter-spacing:1px;box-shadow:3px 3px 0 var(--shadow);
  }

  /* ---------- 侧栏 ---------- */
  .panel{position:absolute;width:176px}
  #left{left:8px;top:62px}
  #right{left:840px;top:62px;width:176px}

  .row{display:flex;align-items:center;gap:6px;padding:5px 8px}
  .row .nm{width:52px;font-size:12px}
  .track{flex:1;height:11px;border:2px solid var(--ink);background:var(--paper2);position:relative;overflow:hidden}
  .track i{display:block;height:100%;background:var(--bamboo)}
  .track i.hot{background:var(--chili)}
  .track i.warm{background:var(--orange)}
  .pct{width:32px;text-align:right;font-size:11px}

  .goal{padding:6px 8px 9px;border-top:2px dashed var(--shadow)}
  .goal .lab{font-size:11px;color:#8a7a63;margin-bottom:4px}
  .goal .num{font-size:12px;margin-bottom:4px}
  .goal .num b{font-size:14px}
  .track.big{height:14px}

  /* 顾客行 */
  .cust{display:flex;gap:5px;align-items:center;padding:6px 7px 10px;border-bottom:2px dashed var(--shadow)}
  .cust:last-of-type{border-bottom:0}
  .ava{width:26px;height:26px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--paper);flex:0 0 26px}
  .cust .info{flex:1;min-width:0;overflow:hidden}
  .cust .n1{font-size:12px;line-height:1.25;white-space:nowrap}
  .cust .n2{font-size:10px;color:#8a7a63;line-height:1.5;white-space:nowrap}
  .tag{display:inline-block;border:1px solid var(--ink);font-size:10px;line-height:13px;padding:0 2px;margin-right:2px;background:var(--paper2);vertical-align:1px}
  .wait{font-size:10px;color:#8a7a63;text-align:right;flex:0 0 30px;white-space:nowrap}
  .wait b{font-size:12px;color:var(--ink)}

  /* ---------- 悬浮卡 ---------- */
  #float{
    position:absolute;left:584px;top:64px;width:190px;
    display:flex;align-items:center;gap:8px;padding:7px 9px;
  }
  #float .big{font-size:22px;line-height:1}
  #float .t1{font-size:12px;line-height:1.3}
  #float .t2{font-size:10px;color:#8a7a63;line-height:1.3}

  /* ---------- 底栏 ---------- */
  #bottombar{
    position:absolute;left:0;bottom:0;width:1024px;height:100px;
    background:rgba(255,248,230,.97);
    border-top:3px solid var(--ink);
    display:flex;align-items:center;gap:8px;padding:0 10px;
    box-shadow:0 -3px 0 rgba(195,173,132,.6);
  }
  .btn{
    width:92px;height:78px;
    border:3px solid var(--ink);
    background:var(--paper);
    box-shadow:4px 4px 0 var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:13px;letter-spacing:2px;
  }
  .btn .ico{width:26px;height:26px;image-rendering:pixelated}
  .btn.on{background:var(--mustard)}
  .status{
    margin-left:auto;text-align:right;font-size:10px;color:#8a7a63;line-height:1.7;
    padding-right:4px;
  }
  .status b{color:var(--bamboo);font-size:11px}
</style>
</head>
<body>
<div id="stage">
  <img id="scene" src="../风格锚/D-店内经营场景.jpg" alt="">

  <!-- 顶栏 -->
  <div id="topbar">
    <div class="logo">老友粉店</div>
    <div class="date">第 <b>1</b> 年 · <b>4</b> 月</div>
    <div class="stat"><span class="k">现金</span><span class="v">¥4,820</span></div>
    <div class="stat"><span class="k">评价</span><span class="stars">★★★☆☆</span><span class="v">3.2</span></div>
    <div class="stat"><span class="k">今日客流</span><span class="v">32</span><span class="k">/40</span><span class="bar-mini"><i style="width:80%"></i></span></div>
    <div class="spacer"></div>
    <div class="pill">● 营业中</div>
  </div>

  <!-- 左侧：热潮 + 月度目标 -->
  <div id="left" class="panel card">
    <div class="ttl">本 月 热 潮</div>
    <div class="row"><span class="nm">酸笋</span><span class="track"><i class="hot" style="width:62%"></i></span><span class="pct">62%</span></div>
    <div class="row"><span class="nm">豆豉</span><span class="track"><i class="warm" style="width:38%"></i></span><span class="pct">38%</span></div>
    <div class="row"><span class="nm">猪杂</span><span class="track"><i style="width:24%"></i></span><span class="pct">24%</span></div>
    <div class="row"><span class="nm">老友汤</span><span class="track"><i class="hot" style="width:71%"></i></span><span class="pct">71%</span></div>
    <div class="goal">
      <div class="lab">月度目标 · 营收</div>
      <div class="num">¥<b>2,410</b> / ¥3,600</div>
      <div class="track big"><i style="width:67%"></i></div>
    </div>
  </div>

  <!-- 右侧：候餐顾客 -->
  <div id="right" class="panel card">
    <div class="ttl">候 餐 顾 客</div>
    <div class="cust">
      <div class="ava" style="background:#d05b4f">强</div>
      <div class="info">
        <div class="n1">阿强</div>
        <div class="n2"><span class="tag">多辣</span>加酸笋</div>
      </div>
      <div class="wait"><b>2</b> 分</div>
    </div>
    <div class="cust">
      <div class="ava" style="background:#5fa34f">婆</div>
      <div class="info">
        <div class="n1">黄阿婆</div>
        <div class="n2"><span class="tag">清淡</span>切粉</div>
      </div>
      <div class="wait"><b>5</b> 分</div>
    </div>
    <div class="cust">
      <div class="ava" style="background:#3f8bc9">学</div>
      <div class="info">
        <div class="n1">学生仔</div>
        <div class="n2"><span class="tag">加粉</span>圆粉</div>
      </div>
      <div class="wait"><b>1</b> 分</div>
    </div>
    <div class="row" style="border-top:2px dashed var(--shadow);padding-top:7px">
      <span class="nm" style="width:auto;color:#8a7a63;font-size:11px">排队</span>
      <span class="track"><i style="width:55%"></i></span>
      <span class="pct">4/8</span>
    </div>
  </div>

  <!-- 悬浮卡：出锅评分 -->
  <div id="float" class="card">
    <svg class="ico" width="26" height="26" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <g fill="#3b2b1d"><rect x="1" y="7" width="14" height="1"/><rect x="2" y="8" width="12" height="1"/><rect x="3" y="9" width="10" height="2"/><rect x="5" y="11" width="6" height="1"/></g>
      <g fill="#ffc845"><rect x="4" y="6" width="2" height="1"/><rect x="9" y="5" width="2" height="1"/></g>
      <g fill="#c8442f"><rect x="6" y="6" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/></g>
    </svg>
    <div>
      <div class="t1">老友粉 · 综合 <b style="font-size:15px">82</b></div>
      <div class="t2">汤鲜 89 · 粉韧 76</div>
    </div>
  </div>

  <!-- 底栏 -->
  <div id="bottombar">
    <div class="btn on">
      <svg class="ico" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="3" y="2" width="10" height="12" fill="#fdf6e3" stroke="#3b2b1d" stroke-width="1"/><rect x="6" y="1" width="4" height="2" fill="#8a5a3b"/><g fill="#3b2b1d"><rect x="5" y="5" width="6" height="1"/><rect x="5" y="8" width="6" height="1"/><rect x="5" y="11" width="4" height="1"/></g></svg>
      菜单
    </div>
    <div class="btn">
      <svg class="ico" viewBox="0 0 16 16" shape-rendering="crispEdges"><g fill="#3b2b1d"><rect x="1" y="7" width="14" height="1"/><rect x="2" y="8" width="12" height="1"/><rect x="3" y="9" width="10" height="2"/><rect x="5" y="11" width="6" height="1"/></g><g fill="#ffc845"><rect x="4" y="6" width="2" height="1"/><rect x="9" y="5" width="2" height="1"/></g></svg>
      配方
    </div>
    <div class="btn">
      <svg class="ico" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect x="2" y="6" width="12" height="7" fill="#f2a33c" stroke="#3b2b1d" stroke-width="1"/><path d="M4 6 L6 2 h4 l2 4" fill="none" stroke="#3b2b1d" stroke-width="1"/><g fill="#3b2b1d"><rect x="5" y="8" width="1" height="3"/><rect x="8" y="8" width="1" height="3"/><rect x="11" y="8" width="1" height="3"/></g></svg>
      采购
    </div>
    <div class="btn">
      <svg class="ico" viewBox="0 0 16 16" shape-rendering="crispEdges"><g fill="#3b2b1d"><rect x="6" y="2" width="4" height="4"/><rect x="4" y="7" width="8" height="7"/></g><g fill="#fdf6e3"><rect x="7" y="3" width="1" height="1"/><rect x="9" y="3" width="1" height="1"/></g></svg>
      员工
    </div>
    <div class="btn">
      <svg class="ico" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M2 7 L8 2 L14 7 V14 H2 Z" fill="#f5e9cc" stroke="#3b2b1d" stroke-width="1"/><rect x="6" y="9" width="4" height="5" fill="#8a5a3b"/></svg>
      店铺
    </div>
    <div class="btn">
      <svg class="ico" viewBox="0 0 16 16" shape-rendering="crispEdges"><path d="M4 2 h8 v4 a4 4 0 0 1 -8 0 z" fill="#ffc845" stroke="#3b2b1d" stroke-width="1"/><g fill="#3b2b1d"><rect x="7" y="9" width="2" height="3"/><rect x="5" y="12" width="6" height="2"/></g></svg>
      比赛
    </div>
    <div class="status">
      第 1 年 4 月 · 第 2 周<br>
      <b>●</b> 存档已同步 15:42<br>
      接续码 <b>K7M2Q9</b>
    </div>
  </div>
</div>
</body>
</html>
