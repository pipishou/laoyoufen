server {
    # 这块放 /etc/nginx/default.d/laoyoufen.conf（本机 default server 只 include default.d/*.conf）
    # 规则：只加路径 → default.d；加新域名 → conf.d。写在 conf.d 里的 location 会报
    # "location" directive is not allowed here。
    #
    # 注意：这里必须用 root 而不是 alias。
    # 用 alias 时 /laoyoufen/assets/index-xxx.js 会被 try_files 回落成 index.html（实测 580 B），
    # 游戏白屏、控制台还看不到错——踩过一次。

    location = /laoyoufen {
        return 301 /laoyoufen/;
    }

    # 带 hash 的资源：长缓存（先写静态正则，避免被 try_files 吃掉）
    location ~ ^/laoyoufen/assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header cache-control "public, max-age=31536000, immutable" always;
    }

    location /laoyoufen/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /laoyoufen/index.html;
        add_header cache-control "no-cache" always;
    }

    # 服务端 API（试玩记录上传 + AI 文案代理）
    location /laoyou-api/ {
        proxy_pass http://127.0.0.1:8767/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
    }
}
