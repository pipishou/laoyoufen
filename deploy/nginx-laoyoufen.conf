server {
    # 这块放 /etc/nginx/default.d/laoyoufen.conf（本机 default server 只 include default.d/*.conf）
    # 规则：只加路径 → default.d；加新域名 → conf.d。写在 conf.d 里的 location 会报
    # "location" directive is not allowed here。

    # 静态站点：/usr/share/nginx/html/laoyoufen/（Vite 产物）
    location = /laoyoufen {
        return 301 /laoyoufen/;
    }

    location /laoyoufen/ {
        alias /usr/share/nginx/html/laoyoufen/;
        index index.html;
        try_files $uri $uri/ /laoyoufen/index.html;
        add_header cache-control "no-cache" always;
        # 带 hash 的资源可以长缓存
        location ~* ^/laoyoufen/assets/.+\.(js|css|woff2|png|jpg|svg)$ {
            alias /usr/share/nginx/html/laoyoufen/;
            add_header cache-control "public, max-age=31536000, immutable" always;
        }
    }

    # 服务端 API（试玩记录上传 + AI 文案代理）
    location /laoyou-api/ {
        proxy_pass http://127.0.0.1:8767/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512k;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
    }
}
